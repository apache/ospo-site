reporting:
  - >
    The VP OSPO reports to the President and contributes to the President's
    report to the Board.
  - >
    Reports cover: notable external engagements, prospective projects
    introduced to the ASF, cross-foundation initiatives, public sector
    engagements, and requests from PMCs.
  - >
    The role is appointed according to the ASF's usual process for officers,
    and is reviewed periodically like other officer positions.

measures_of_success:
  - title: Clear, consistent entry point
    description: >
      External organizations know how to reach the ASF and receive a timely,
      consistent response.
  - title: Better-prepared incoming projects
    description: >
      Prospective projects reach the ASF better prepared and with a clearer
      understanding of the Apache Way.
  - title: Valuable PMC introductions
    description: >
      PMCs report useful introductions and new contributors or adopters
      resulting from OSPO activity.
  - title: Constructive public & cross-foundation voice
    description: >
      The ASF is a recognized and constructive participant in public sector and
      cross-foundation discussions about open source.
  - title: Trusted vendor neutrality
    description: >
      No complaints of preferential treatment or vendor bias.

new_project_steps:
  - step: "01"
    title: Explore & Assess Fit
    description: >
      Start a conversation with the OSPO as a visible entry point. Learn what
      the ASF offers and expects under the Apache Way, and assess whether the
      ASF is the right home for your project and community.
  - step: "02"
    title: Connect with Incubator & PMCs
    description: >
      Get connected with the Apache Incubator PMC—the main partner for
      prospective projects—as well as relevant existing Apache PMCs to explore
      mentorship, alignment, and community readiness.
  - step: "03"
    title: Coordinate Onboarding Teams
    description: >
      Navigate onboarding smoothly through coordinated introductions to Legal
      Affairs, Brand Management, Infrastructure, and Security so expectations
      on licensing, trademarks, tooling, and security are clear early.
  - step: "04"
    title: Independent Governance Decision
    description: >
      Project acceptance follows established ASF governance processes. The
      decision to accept a project remains entirely with the Board—the VP OSPO
      facilitates and recommends, and never decides or votes by virtue of the
      role.

pmc_ecosystem_items:
  - title: New contributors, adopters & collaborators
    description: >
      Help PMCs that ask for it to connect with companies, public institutions,
      and research organizations interested in contributing to or adopting
      their project.
  - title: Cross-project & cross-foundation integrations
    description: >
      Highlight integration opportunities between Apache projects, as well as
      between Apache projects and projects hosted in other open source
      foundations.
  - title: Real-world adoption feedback
    description: >
      Share adoption stories, needs, and feedback from external organizations
      directly with the relevant PMCs—while always respecting PMC autonomy.
  - title: Joint visibility & events
    description: >
      Work alongside Marketing & Publicity and Conferences to highlight Apache
      projects and their ecosystems across announcements and events.
  - title: Contributor & employer diversity
    description: >
      Encourage broad diversity of contributors and employers within project
      communities, strengthening long-term community health and resilience.

routing_topics:
  - id: corporate-ospo
    label: Corporate OSPO & Participation
    badge: Start with VP OSPO
    owner: VP OSPO (routing to relevant PMCs & Officers)
    summary: >
      Ideal first stop for companies wanting to understand how to participate
      under the Apache Way—contributing as individuals, merit-based governance,
      CLAs/CCLAs, upstream-first practices, and long-term sustainability.
    what_happens: >
      VP OSPO explains ASF participation norms and introduces you to the right
      PMCs or Foundation officers without acting on their behalf.
    action_label: Review Vendors & Companies Guide
    action_url: /engage/#vendors-companies
    external: false

  - id: bring-project
    label: Bring a Project to The ASF
    badge: Start with VP OSPO
    owner: VP OSPO → Apache Incubator PMC & Board
    summary: >
      Considering donating or moving an open source project to The ASF? Start
      here to understand what the Foundation offers and expects before formal
      incubation proposals.
    what_happens: >
      VP OSPO helps assess fit, connects you with the Apache Incubator PMC and
      relevant PMCs, and coordinates onboarding teams (Legal, Brand, Infra,
      Security). Acceptance decisions remain solely with the Board.
    action_label: Explore Project Onboarding
    action_url: /projects/#bringing-a-project
    external: false

  - id: public-sector
    label: Public Sector, Regulation & Policy
    badge: Start with VP OSPO
    owner: VP OSPO (coordinating Public Affairs, Legal, Security, Privacy, President & Board)
    summary: >
      For governments, public administrations, regulators, and public research
      institutions engaging on cybersecurity regulation, procurement, digital
      sovereignty, or public-sector open source adoption.
    what_happens: >
      VP OSPO acts as liaison and coordinates with the relevant ASF officers so
      the Foundation speaks with one consistent voice.
    action_label: Read Public Sector Engagement
    action_url: /engage/#public-sector
    external: false

  - id: peer-foundations
    label: Cross-Foundation Collaboration
    badge: Start with VP OSPO
    owner: VP OSPO & Peer Foundation Liaisons
    summary: >
      For peer open source foundations and community organizations exploring
      shared standards, tooling, project interoperability, joint events, or
      common policy positions.
    what_happens: >
      VP OSPO maintains ongoing relationships across foundations and helps
      navigate questions where projects span or depend on multiple foundations.
    action_label: Peer Foundation Collaboration
    action_url: /engage/#peer-foundations
    external: false

  - id: pmc-ecosystem
    label: Apache PMC Ecosystem Support
    badge: Opt-in for PMCs
    owner: VP OSPO (strictly on PMC request or agreement)
    summary: >
      For Apache PMCs seeking introductions to potential contributors,
      adopters, public institutions, research groups, or cross-foundation
      integration partners.
    what_happens: >
      PMCs retain full autonomy over technical and community decisions. VP OSPO
      facilitates introductions and works with Marketing & Publicity and
      Conferences when requested.
    action_label: PMC Ecosystem Support
    action_url: /projects/#expanding-ecosystems
    external: false

  - id: sponsorship
    label: Corporate Sponsorship & Donations
    badge: Direct to VP Fundraising
    owner: VP Fundraising
    summary: >
      Want to sponsor The Apache Software Foundation or make a financial
      donation to support ASF infrastructure and operations?
    what_happens: >
      The VP OSPO is not a replacement for Fundraising. Sponsorship and
      donation conversations are handled directly by VP Fundraising, and
      sponsorship never confers preferential access to projects.
    action_label: Visit ASF Sponsorship
    action_url: https://www.apache.org/foundation/sponsorship
    external: true

  - id: security
    label: Security Vulnerability Report
    badge: Direct to Security Team
    owner: ASF Security Team
    summary: >
      Reporting a security vulnerability in an Apache project? Always follow
      the official ASF coordinated vulnerability disclosure process directly.
    what_happens: >
      The ASF Security Team owns vulnerability handling directly. VP OSPO
      coordinates with the Security Team only on broader external supply-chain
      and regulatory security topics.
    action_label: Report a Vulnerability
    action_url: https://www.apache.org/security/
    external: true

  - id: legal-brand
    label: Legal, Licensing & Trademarks
    badge: Direct to Legal / Brand
    owner: VP Legal Affairs & VP Brand Management
    summary: >
      Specific legal, licensing, CLA/CCLA, or Apache trademark and naming
      inquiries are governed by the Foundation's dedicated officers.
    what_happens: >
      VP Legal Affairs owns legal and licensing matters; VP Brand Management
      owns trademark and naming questions. VP OSPO routes external questions to
      them rather than duplicating their authority.
    action_label: ASF Legal & Trademark Policies
    action_url: https://www.apache.org/legal/
    external: true

  - id: press-events
    label: Press, Media & Joint Events
    badge: Direct to Marketing / Conferences
    owner: VP Marketing & Publicity / VP Conferences
    summary: >
      Media inquiries, official announcements, press requests, and Community
      Over Code or joint event inquiries.
    what_happens: >
      VP Marketing & Publicity owns public communications and press; VP
      Conferences owns ASF events. VP OSPO partners with both on ecosystem
      visibility and joint initiatives.
    action_label: ASF Newsroom & Press
    action_url: https://www.apache.org/press/
    external: true

