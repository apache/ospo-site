# "VP OSPO at The Apache Software Foundation — Role and Mission"

mission: >
  Make it easy for the world to engage with the Apache Software Foundation, and
  help Apache projects and communities thrive through those relationships, in a
  way that is consistent with the Apache Way and the Foundation's vendor neutrality.

summary:
  lead: >
    The Vice President, Open Source Program Office (VP OSPO) is the ASF officer
    responsible for being the Foundation's primary point of contact with
    organizations outside the ASF that consume, contribute to, fund, regulate,
    or collaborate with Apache projects. This includes software vendors and
    companies (typically via their OSPOs), public sector OSPOs, and other open
    source foundations.
  connector: >
    The VP OSPO acts as a connector: routing external interest to the right
    people inside the Foundation, helping prospective projects find their way
    to the ASF, and helping existing Apache projects grow healthy, diverse
    ecosystems. The role is a facilitator and liaison. It does not take
    technical, governance, or acceptance decisions away from the bodies that
    already own them.

contact_email: contact@ospo.apache.org
discuss_list: discuss@ospo.apache.org

rationale_drivers:
  - title: Companies & Contributors
    description: >
      Companies want to contribute to projects, donate code, or understand how
      to participate under the Apache Way.
    accent: purple
  - title: Corporate OSPOs
    description: >
      Corporate OSPOs want a clear counterpart to discuss contribution
      policies, security, and long-term sustainability.
    accent: crimson
  - title: Public Sector Organizations
    description: >
      Public sector organizations are adopting open source at scale and
      increasingly engage on regulation, procurement, digital sovereignty, and
      software supply-chain security.
    accent: orange
  - title: Peer Open Source Foundations
    description: >
      Other open source foundations collaborate with the ASF on shared
      standards, cross-project integrations, policy positions, and joint
      initiatives.
    accent: amber

audiences:
  - id: vendors-companies
    eyebrow: Corporate & Commercial
    title: Vendors & Companies
    tagline: First point of contact for organizations engaging with The ASF or Apache projects.
    href: /engage/#vendors-companies
    accent: purple
    bullets:
      - Serve as the first point of contact for companies that want to engage with the ASF or with specific Apache projects.
      - "Explain how to participate effectively: contributing as individuals, merit-based governance, licensing and CLAs/CCLAs, trademark usage, and the separation between employers and project roles."
      - Connect companies with the appropriate PMCs and officers (Brand Management, Legal Affairs, Fundraising, Security, etc.), rather than acting on their behalf.
      - Engage with corporate OSPOs on topics such as contribution policies, sustainability, and upstream-first practices.

  - id: public-sector
    eyebrow: Government & Policy
    title: Public Sector
    tagline: Liaison to governments, public administrations, regulators, and public research institutions.
    href: /engage/#public-sector
    accent: crimson
    bullets:
      - Act as the ASF's liaison to governments, public administrations, regulators, and public research institutions.
      - Help public sector organizations understand how they can use, contribute to, and support Apache projects.
      - Coordinate, together with the relevant officers (Public Affairs, Legal Affairs, Security, Privacy, the President and the Board), the ASF's engagement on public policy topics affecting open source, such as cybersecurity regulation, procurement, and digital sovereignty initiatives.
      - Make sure the ASF speaks with one consistent voice in these discussions.

  - id: peer-foundations
    eyebrow: Cross-Foundation
    title: Peer Foundations & Communities
    tagline: Working relationships across the broader open source ecosystem.
    href: /engage/#peer-foundations
    accent: orange
    bullets:
      - Maintain working relationships with peer foundations and open source organizations.
      - "Identify opportunities for collaboration: shared tooling, interoperability between projects, joint events, common positions on policy, and shared best practices."
      - Help resolve questions where projects span or depend on multiple foundations.

  - id: projects-ecosystems
    eyebrow: Onboarding & Growth
    title: Prospective Projects & Apache PMCs
    tagline: Guiding incoming communities to the ASF and helping existing PMCs grow diverse ecosystems.
    href: /projects/
    accent: amber
    bullets:
      - Be a visible entry point for organizations and communities considering bringing a project to the ASF.
      - Connect prospective projects with the Apache Incubator PMC, relevant existing PMCs, and onboarding teams (Legal, Brand, Infrastructure, Security).
      - Help PMCs that ask for it to find new contributors, adopters, and collaborators across companies, public institutions, and research organizations.
      - Encourage diversity of contributors and employers within project communities to strengthen project resilience.

principles:
  - number: "01"
    title: Vendor neutrality
    description: >
      The VP OSPO represents the Foundation, not any employer, vendor, or
      customer. All organizations are treated equally regardless of size,
      sponsorship level, or commercial relationship with any officer.
  - number: "02"
    title: PMC autonomy
    description: >
      PMCs own the technical direction and community decisions of their
      projects. The VP OSPO can make introductions and share information, but
      never commits a project to anything or speaks on its behalf without the
      PMC's agreement.
  - number: "03"
    title: Facilitate, don't duplicate
    description: >
      Existing officers and committees keep their responsibilities: Legal
      Affairs for legal questions, Brand Management for trademarks, Fundraising
      for sponsorship, Security for vulnerability handling, Marketing &
      Publicity for press. The VP OSPO routes and coordinates.
  - number: "04"
    title: Openness
    description: >
      Consistent with the Apache Way, discussions are held on public mailing
      lists whenever possible. Private channels are used only when
      confidentiality is genuinely required (for example, early-stage
      discussions with an organization or sensitive policy matters), and
      outcomes are shared publicly once appropriate.
  - number: "05"
    title: Conflict of interest
    description: >
      The VP OSPO discloses any affiliation that could create a conflict of
      interest and recuses from discussions where appropriate.

what_role_is_not:
  - title: Not a sales or business-development function
    description: >
      Not a sales or business-development function on behalf of any company.
  - title: Not preferential access
    description: >
      Not a channel for preferential access to projects, roadmaps, or
      decision-makers.
  - title: Not a decision-making authority
    description: >
      Not a decision-making authority over project acceptance, project
      governance, or technical choices.
  - title: Not a replacement for Fundraising
    description: >
      Not a replacement for Fundraising: sponsorship conversations are handed
      over to VP Fundraising.

